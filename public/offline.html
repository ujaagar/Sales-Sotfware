<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1C33">
<title>Offline · Ujaagar Sales</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: #0E1C33; color: #F5F7FB;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 360px; text-align: center; }
  img { height: 40px; margin-bottom: 32px; }
  h1 { font-family: Poppins, system-ui, sans-serif; font-weight: 600; font-size: 24px; margin: 0 0 8px; }
  p { color: #A9B4C7; line-height: 1.5; margin: 0 0 24px; }
  button {
    font: inherit; font-weight: 500; color: #fff; background: #4169FF; border: 0; border-radius: 12px;
    padding: 12px 24px; min-height: 48px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/brand/logo-on-dark.png" alt="Ujaagar Digital">
  <h1>You're offline</h1>
  <p>Ujaagar Sales needs the internet to show your leads, deals and commission. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
